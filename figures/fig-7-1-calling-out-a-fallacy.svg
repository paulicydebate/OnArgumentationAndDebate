<svg xmlns='http://www.w3.org/2000/svg' width='910' height='225' viewBox='0 0 910 225' role='img'><title>Calling out a fallacy</title><rect width='910' height='225' fill='#FFFFFF'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#111111'/></marker><marker id='ag' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1F5135'/></marker></defs><rect x='30' y='40' width='250' height='120' rx='10' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='155' y='76' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#111111' font-weight="bold">1. Name it</text><text x='155' y='106' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111'>That is a hasty</text><text x='155' y='126' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111'>generalization.</text><line x1='280' y1='100' x2='328' y2='100' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><rect x='330' y='40' width='250' height='120' rx='10' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='455' y='76' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#111111' font-weight="bold">2. Explain it</text><text x='455' y='106' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111'>One school is not</text><text x='455' y='126' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111'>every school.</text><line x1='580' y1='100' x2='628' y2='100' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><rect x='630' y='40' width='250' height='120' rx='10' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='755' y='76' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#111111' font-weight="bold">3. So what</text><text x='755' y='106' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111'>Their claim has no</text><text x='755' y='126' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111'>support left.</text><text x='455' y='200' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#6B7280' font-style="italic">Naming alone is not an answer.</text></svg>