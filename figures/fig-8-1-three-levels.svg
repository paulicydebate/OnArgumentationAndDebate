<svg xmlns='http://www.w3.org/2000/svg' width='720' height='370' viewBox='0 0 720 370' role='img'><title>Three levels of research</title><rect width='720' height='370' fill='#FFFFFF'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#111111'/></marker><marker id='ag' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1F5135'/></marker></defs><polygon points='30.0,30 590.0,30 520.0,130 100.0,130' fill='#1F5135' stroke='#1F5135' stroke-width='2'/><text x='310' y='76' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='20' fill='#FFFFFF' font-weight="bold">Exploratory</text><text x='310' y='100' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#FFFFFF'>learn the territory</text><polygon points='100.0,140 520.0,140 450.0,240 170.0,240' fill='#3E7A57' stroke='#1F5135' stroke-width='2'/><text x='310' y='186' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='20' fill='#FFFFFF' font-weight="bold">Focused</text><text x='310' y='210' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#FFFFFF'>follow the questions</text><polygon points='170.0,250 450.0,250 410.0,350 210.0,350' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='310' y='296' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='20' fill='#111111' font-weight="bold">Targeted</text><text x='310' y='320' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111'>find a specific answer</text><line x1='660' y1='40' x2='660' y2='320' stroke='#111111' stroke-width='2' marker-end='url(#a)'/><text x='680' y='185' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#6B7280' transform='rotate(90 680 185)' text-anchor='middle'>Let the literature lead</text></svg>