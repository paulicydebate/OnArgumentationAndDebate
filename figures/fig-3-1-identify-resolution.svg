<svg xmlns='http://www.w3.org/2000/svg' width='760' height='500' viewBox='0 0 760 500' role='img'><title>Identifying a resolution</title><rect width='760' height='500' fill='#FFFFFF'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#111111'/></marker><marker id='ag' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1F5135'/></marker></defs><text x='240' y='30' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111111' font-weight="bold">Read the resolution</text><line x1='240' y1='38' x2='240' y2='58' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><polygon points='240,60.0 390.0,120 240,180.0 90.0,120' fill='#FFFFFF' stroke='#1F5135' stroke-width='2'/><text x='240' y='116' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111' font-weight="bold">Actor + should + action?</text><text x='240' y='136' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>who should do what</text><line x1='390' y1='120' x2='538' y2='120' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><text x='462' y='112' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1F5135' font-weight="bold">yes</text><rect x='540' y='92' width='180' height='56' rx='8' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='630.0' y='116.6' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' font-weight='bold' fill='#111111'>Policy</text><text x='630.0' y='136.6' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>net benefits</text><line x1='240' y1='180' x2='240' y2='228' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><text x='256' y='210' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280' font-weight="bold">no</text><polygon points='240,230.0 400.0,300 240,370.0 80.0,300' fill='#FFFFFF' stroke='#1F5135' stroke-width='2'/><text x='240' y='296' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#111111' font-weight="bold">Ought, a comparison, or</text><text x='240' y='316' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>a judgment of good or bad?</text><line x1='400' y1='300' x2='538' y2='300' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><text x='468' y='292' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1F5135' font-weight="bold">yes</text><rect x='540' y='272' width='180' height='56' rx='8' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='630.0' y='296.6' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' font-weight='bold' fill='#111111'>Value</text><text x='630.0' y='316.6' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>value and criterion</text><line x1='240' y1='370' x2='240' y2='418' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><text x='256' y='400' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280' font-weight="bold">no</text><rect x='150' y='420' width='180' height='56' rx='8' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='240.0' y='444.6' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' font-weight='bold' fill='#111111'>Fact</text><text x='240.0' y='464.6' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>preponderance of evidence</text></svg>