<svg xmlns='http://www.w3.org/2000/svg' width='1010' height='230' viewBox='0 0 1010 230' role='img'><title>Four moves for checking a source (SIFT)</title><rect width='1010' height='230' fill='#FFFFFF'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#111111'/></marker><marker id='ag' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1F5135'/></marker></defs><rect x='20' y='30' width='220' height='170' rx='10' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='130' y='95' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='48' fill='#1F5135' font-weight="bold">S</text><text x='130' y='135' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#111111' font-weight="bold">Stop</text><text x='130' y='162' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>Do I know this source?</text><line x1='240' y1='115' x2='268' y2='115' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><rect x='270' y='30' width='220' height='170' rx='10' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='380' y='95' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='48' fill='#1F5135' font-weight="bold">I</text><text x='380' y='135' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#111111' font-weight="bold">Investigate the source</text><text x='380' y='162' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>Who is behind it?</text><line x1='490' y1='115' x2='518' y2='115' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><rect x='520' y='30' width='220' height='170' rx='10' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='630' y='95' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='48' fill='#1F5135' font-weight="bold">F</text><text x='630' y='135' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#111111' font-weight="bold">Find better coverage</text><text x='630' y='162' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>Is there a stronger source?</text><line x1='740' y1='115' x2='768' y2='115' stroke='#111111' stroke-width='2' marker-end="url(#a)"/><rect x='770' y='30' width='220' height='170' rx='10' fill='#E3EDE6' stroke='#1F5135' stroke-width='2'/><text x='880' y='95' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='48' fill='#1F5135' font-weight="bold">T</text><text x='880' y='135' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#111111' font-weight="bold">Trace claims</text><text x='880' y='162' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#6B7280'>What does the original say?</text></svg>